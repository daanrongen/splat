[project]
name = "splat"
version = "0.1.4"
description = "A universal converter for Gaussian Splatting files and models."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daan Rongen", email = "daan.rongen@field.io" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.1",
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "huggingface-hub>=0.27",
    "plyfile>=1.1",
    "mlx>=0.32.2",
    "regex>=2026.9.3",
    "transformers>=5.16.1",
    "coremltools>=9.0",
    "trimesh>=4.4",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "open-clip-torch>=3.2",
    "realesrgan-mlx",
    "mlx3d[capture]>=0.3.0",
    "open3d>=0.19",
]

[project.scripts]
splat = "splat.cli.main:app"

[project.urls]
Homepage = "https://github.com/daanrongen/splat"
Repository = "https://github.com/daanrongen/splat"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "syrupy>=4.7",
    "hypothesis>=6.115",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/_vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["splat"]

[tool.ruff.lint.per-file-ignores]
# Bootstraps HF_HOME and the cache dirs before the transitive huggingface_hub
# import (it reads HF_HOME at import time), so its imports cannot come first.
"src/splat/cli/main.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.File", "fastapi.Form"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=splat --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: runs a real model forward pass; needs SPLAT_INTEGRATION_TESTS=1",
]

[tool.coverage.run]
omit = ["*/_vendor/*"]

[tool.uv.sources]
realesrgan-mlx = { git = "https://github.com/xocialize/realesrgan-mlx.git" }

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
