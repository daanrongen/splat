[project]
name = "splat"
version = "0.1.0"
description = "A universal converter for Gaussian Splatting files and models."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daan Rongen", email = "daan.rongen@field.io" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.1",
    "torch>=2.5",
    "huggingface-hub>=0.27",
    "plyfile>=1.1",
]

[project.scripts]
splat = "splat.cli.main:app"

[project.urls]
Homepage = "https://github.com/daanrongen/splat"
Repository = "https://github.com/daanrongen/splat"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "syrupy>=4.7",
    "hypothesis>=6.115",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["splat"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=splat --cov-report=term-missing"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
