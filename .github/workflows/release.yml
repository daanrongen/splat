name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -m "not slow"

      - name: Build distribution
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build-and-test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  homebrew:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: Justintime50/homebrew-releaser@v2
        with:
          homebrew_owner: daanrongen
          homebrew_tap: homebrew-splat
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit_owner: homebrew-releaser-bot
          commit_email: daan.rongen@field.io
          install: |
            virtualenv_install_with_resources
          test: |
            system "#{bin}/splat", "--help"
          dependencies: |
            depends_on "python@3.12"
          update_python_resources: true
