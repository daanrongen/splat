name: Build

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
