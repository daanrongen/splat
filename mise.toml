[tools]
python = "3.12"
uv = "latest"
lefthook = "latest"

[settings]
python.uv_venv_auto = "create|source"

[env]
_.file = [".env"]
SPLAT_CACHE_ROOT = "{{env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache')}}/splat"
HF_HOME = "{{env.SPLAT_CACHE_ROOT}}/huggingface"
SPLAT_MODEL_CACHE_DIR = "{{env.SPLAT_CACHE_ROOT}}/models"
SPLAT_ASSET_CACHE_DIR = "{{env.SPLAT_CACHE_ROOT}}/assets"

[tasks]
lint = "uv run ruff check ."
format = "uv run ruff format ."
test = "uv run pytest"
run = "uv run splat"

[tasks.check]
description = "Run lint + format check + tests (CI-equivalent, locally)"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run pytest",
]
