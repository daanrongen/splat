[tools]
python = "3.12"
uv = "latest"
lefthook = "latest"

[settings]
python.uv_venv_auto = "create|source"

[env]
PYTHONDONTWRITEBYTECODE = "1"
_.file = [".env"]
SPLAT_CACHE_ROOT = "{{env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache')}}/splat"
SPLAT_MODEL_CACHE_DIR = "{{env.SPLAT_CACHE_ROOT}}/models"
SPLAT_MANIFEST_CACHE_DIR = "{{env.SPLAT_CACHE_ROOT}}/manifests"

[tasks]
lint = "uv run ruff check ."
format = "uv run ruff format ."
test = "uv run pytest"
run = "uv run splat"

[tasks.check]
description = "Run lint + format check + tests (CI-equivalent, locally)"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run pytest",
]

[tasks.env-example]
description = "Regenerate .env.example from the CLI's own option definitions"
run = "uv run splat env --export > .env.example"
