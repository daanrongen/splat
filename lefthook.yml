pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check --fix --force-exclude {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format --force-exclude {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: pytest
      run: uv run pytest
